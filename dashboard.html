<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student OS — Personal Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen antialiased">

  <!-- auth overlay: shown until signed in -->
  <div id="auth-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
    <div class="w-full max-w-sm bg-slate-900/80 border border-slate-800 rounded-2xl p-6">
      <h1 class="font-bold text-xl mb-1">⚡ Student<span class="text-indigo-400">OS</span></h1>
      <p class="text-sm text-slate-400 mb-5">Sign in to sync across your devices.</p>
      <form id="auth-form" class="space-y-3">
        <input id="auth-email" type="email" required placeholder="Email" autocomplete="email"
               class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
        <input id="auth-password" type="password" required minlength="6" placeholder="Password (6+ characters)" autocomplete="current-password"
               class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
        <p id="auth-error" class="text-xs text-rose-400 hidden"></p>
        <div class="flex gap-2 pt-1">
          <button type="submit" data-mode="login"
                  class="flex-1 bg-indigo-500 hover:bg-indigo-400 text-white rounded-lg px-4 py-2 text-sm font-medium">Log In</button>
          <button type="submit" data-mode="signup"
                  class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg px-4 py-2 text-sm font-medium">Sign Up</button>
        </div>
      </form>
      <p id="auth-status" class="text-xs text-slate-500 mt-3"></p>
    </div>
  </div>

  <div id="app-shell" class="hidden">
  <header class="sticky top-0 z-20 backdrop-blur bg-slate-950/80 border-b border-slate-800">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3 px-4 py-3">
      <h1 class="font-bold text-lg tracking-tight">⚡ Student<span class="text-indigo-400">OS</span></h1>
      <span id="header-date" class="text-sm text-slate-400 hidden sm:block"></span>
      <span class="flex-1"></span>
      <button id="sign-out"
              class="text-xs text-slate-500 hover:text-rose-400 border border-slate-700 rounded-lg px-3 py-1.5">Sign out</button>
      <button id="quick-add"
              class="bg-indigo-500 hover:bg-indigo-400 text-white text-sm font-medium rounded-lg px-3.5 py-1.5">
        ＋ Brain Dump
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 pb-24 lg:pb-6">
    <section id="calendar-module"
             class="lg:col-span-7 scroll-mt-20 rounded-2xl bg-slate-900/60 border border-slate-800 p-4"></section>

    <section id="energy-module"
             class="lg:col-span-5 scroll-mt-20 rounded-2xl bg-slate-900/60 border border-slate-800 p-4"></section>

    <section id="ledger-module"
             class="lg:col-span-5 scroll-mt-20 rounded-2xl bg-slate-900/60 border border-slate-800 p-4"></section>

    <section id="notes-module"
             class="lg:col-span-7 scroll-mt-20 rounded-2xl bg-slate-900/60 border border-slate-800 p-4"></section>

    <section id="gym-module"
             class="lg:col-span-12 scroll-mt-20 rounded-2xl bg-slate-900/60 border border-slate-800 p-4"></section>

    <section id="portfolio-module"
             class="lg:col-span-12 scroll-mt-20 rounded-2xl bg-slate-900/60 border border-slate-800 p-4"></section>
  </main>

  <!-- mobile bottom nav -->
  <nav class="lg:hidden fixed bottom-0 inset-x-0 z-20 backdrop-blur bg-slate-950/90 border-t border-slate-800">
    <div class="grid grid-cols-6 text-center text-xs text-slate-400">
      <button data-nav="calendar-module" class="py-3 hover:text-indigo-300"><span class="block text-lg">📅</span>Deadlines</button>
      <button data-nav="energy-module" class="py-3 hover:text-indigo-300"><span class="block text-lg">⚡</span>Tasks</button>
      <button data-nav="ledger-module" class="py-3 hover:text-indigo-300"><span class="block text-lg">💰</span>Ledger</button>
      <button data-nav="notes-module" class="py-3 hover:text-indigo-300"><span class="block text-lg">📝</span>Notes</button>
      <button data-nav="gym-module" class="py-3 hover:text-indigo-300"><span class="block text-lg">🏋️</span>Gym</button>
      <button data-nav="portfolio-module" class="py-3 hover:text-indigo-300"><span class="block text-lg">📈</span>Stocks</button>
    </div>
  </nav>
  </div>

<script>
(() => {
"use strict";

/* =========================================================
   STORE — single source of truth: state, persistence, pub/sub
   ========================================================= */

const KEY = "student_os_v1";

const firebaseConfig = {
  apiKey: "AIzaSyDSUuW6EdJ21CbECrvYbwM-ZmOWFLvkPVo",
  authDomain: "student-os-bae97.firebaseapp.com",
  projectId: "student-os-bae97",
  storageBucket: "student-os-bae97.firebasestorage.app",
  messagingSenderId: "756152469935",
  appId: "1:756152469935:web:83fdfba604eb3bc43a875a",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function defaultState() {
  return {
    version: 1,
    settings: { userName: "Sahil", currency: "£", currentEnergy: "high" },
    deadlines: [],
    tasks: [],
    transactions: [],
    notes: [],
    workouts: [],
    holdings: [],
  };
}

const Store = {
  state: defaultState(),
  _listeners: {},
  isFirstRun: false,
  _uid: null,

  load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        this.state = { ...defaultState(), ...JSON.parse(raw) };
      } else {
        this.isFirstRun = true;
      }
    } catch (e) {
      console.warn("Store: could not load saved state, starting fresh", e);
    }
  },

  save() {
    localStorage.setItem(KEY, JSON.stringify(this.state));
    this.pushToCloud();
  },

  pushToCloud() {
    if (!this._uid) return;
    db.collection("users").doc(this._uid).set(
      { ...this.state, updatedAt: firebase.firestore.FieldValue.serverTimestamp() },
      { merge: true }
    ).catch((e) => console.warn("Cloud sync failed", e));
  },

  // Applied when a Firestore snapshot arrives (from this device's own write or another device).
  // Deliberately does not call save()/pushToCloud() to avoid a write feedback loop.
  applyRemote(remoteState) {
    const { updatedAt, ...rest } = remoteState;
    this.state = { ...defaultState(), ...rest };
    localStorage.setItem(KEY, JSON.stringify(this.state));
    ["deadlines", "tasks", "transactions", "notes", "workouts", "holdings"].forEach((c) => this.emit(`${c}:changed`));
    this.emit("settings:changed");
  },

  subscribe(event, fn) {
    (this._listeners[event] ??= []).push(fn);
  },

  emit(event) {
    (this._listeners[event] ?? []).forEach((fn) => fn());
  },

  uid(prefix) {
    return `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  },

  add(collection, item) {
    this.state[collection].push(item);
    this.save();
    this.emit(`${collection}:changed`);
    return item;
  },

  update(collection, id, patch) {
    const item = this.state[collection].find((i) => i.id === id);
    if (!item) return;
    Object.assign(item, patch);
    this.save();
    this.emit(`${collection}:changed`);
  },

  remove(collection, id) {
    this.state[collection] = this.state[collection].filter((i) => i.id !== id);
    this.save();
    this.emit(`${collection}:changed`);
  },

  setSetting(key, value) {
    this.state.settings[key] = value;
    this.save();
    this.emit("settings:changed");
  },
};

// ---- shared helpers ----

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

const SOURCE = {
  uni: { label: "Uni", dot: "bg-blue-400", badge: "bg-blue-500/15 text-blue-300 border border-blue-500/30" },
  hustle: { label: "Hustle", dot: "bg-emerald-400", badge: "bg-emerald-500/15 text-emerald-300 border border-emerald-500/30" },
};

/* =========================================================
   CALENDAR MODULE — month grid + unified deadline list
   ========================================================= */

const CalendarModule = {
  el: null,
  view: { y: 0, m: 0 }, // m is 0-indexed

  init() {
    this.el = document.getElementById("calendar-module");
    const now = new Date();
    this.view = { y: now.getFullYear(), m: now.getMonth() };

    this.el.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const { action, id } = btn.dataset;
      if (action === "prev-month") {
        this.view.m--;
        if (this.view.m < 0) { this.view.m = 11; this.view.y--; }
        this.render();
      } else if (action === "next-month") {
        this.view.m++;
        if (this.view.m > 11) { this.view.m = 0; this.view.y++; }
        this.render();
      } else if (action === "toggle-deadline") {
        const dl = Store.state.deadlines.find((d) => d.id === id);
        if (dl) Store.update("deadlines", id, { done: !dl.done });
      } else if (action === "delete-deadline") {
        Store.remove("deadlines", id);
      }
    });

    this.el.addEventListener("submit", (e) => {
      if (e.target.id !== "deadline-form") return;
      e.preventDefault();
      const f = e.target;
      const title = f.title.value.trim();
      const dueDate = f.dueDate.value;
      if (!title || !dueDate) return;
      Store.add("deadlines", {
        id: Store.uid("dl"),
        title,
        source: f.source.value,
        dueDate,
        done: false,
        notes: "",
      });
      f.reset();
      f.dueDate.value = todayISO();
    });

    Store.subscribe("deadlines:changed", () => this.render());
    this.render();
  },

  render() {
    const { y, m } = this.view;
    const today = todayISO();
    const monthName = new Date(y, m, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });

    const byDate = {};
    for (const dl of Store.state.deadlines) {
      (byDate[dl.dueDate] ??= []).push(dl);
    }

    const firstWeekday = (new Date(y, m, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    let cells = "";
    for (let i = 0; i < firstWeekday; i++) cells += `<div></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const isToday = iso === today;
      const dots = (byDate[iso] ?? [])
        .slice(0, 3)
        .map((dl) => `<span class="w-1.5 h-1.5 rounded-full ${SOURCE[dl.source].dot}"></span>`)
        .join("");
      cells += `
        <div class="aspect-square flex flex-col items-center justify-center rounded-lg text-sm
                    ${isToday ? "bg-indigo-500/20 ring-1 ring-indigo-400 font-bold text-indigo-200" : "text-slate-300 hover:bg-slate-800/60"}">
          <span>${d}</span>
          <span class="flex gap-0.5 h-1.5 mt-0.5">${dots}</span>
        </div>`;
    }

    const sorted = [...Store.state.deadlines].sort((a, b) =>
      a.done - b.done || a.dueDate.localeCompare(b.dueDate)
    );
    const rows = sorted.map((dl) => {
      const overdue = !dl.done && dl.dueDate < today;
      const s = SOURCE[dl.source];
      return `
        <li class="flex items-center gap-3 py-2 group">
          <button data-action="toggle-deadline" data-id="${dl.id}"
                  class="w-5 h-5 shrink-0 rounded border ${dl.done ? "bg-emerald-500 border-emerald-500" : "border-slate-600 hover:border-slate-400"} flex items-center justify-center text-xs text-slate-950 font-bold">
            ${dl.done ? "✓" : ""}
          </button>
          <div class="flex-1 min-w-0">
            <p class="truncate ${dl.done ? "line-through text-slate-500" : ""}">${escapeHtml(dl.title)}</p>
          </div>
          <span class="text-[11px] px-2 py-0.5 rounded-full ${s.badge}">${s.label}</span>
          <span class="text-xs w-16 text-right ${overdue ? "text-rose-400 font-semibold" : "text-slate-400"}">
            ${overdue ? "⚠ " : ""}${formatDate(dl.dueDate)}
          </span>
          <button data-action="delete-deadline" data-id="${dl.id}"
                  class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 px-1">✕</button>
        </li>`;
    }).join("");

    this.el.innerHTML = `
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold text-slate-100">📅 Calendar &amp; Deadlines</h2>
        <div class="flex items-center gap-2 text-sm">
          <button data-action="prev-month" class="px-2 py-1 rounded hover:bg-slate-800">‹</button>
          <span class="w-32 text-center text-slate-300">${monthName}</span>
          <button data-action="next-month" class="px-2 py-1 rounded hover:bg-slate-800">›</button>
        </div>
      </div>

      <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-500 mb-1">
        ${["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map((d) => `<div>${d}</div>`).join("")}
      </div>
      <div class="grid grid-cols-7 gap-1 mb-4">${cells}</div>

      <div class="flex items-center gap-3 text-xs text-slate-400 mb-2">
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-400"></span> Uni</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> Hustle</span>
      </div>

      <ul class="divide-y divide-slate-800 mb-3 max-h-56 overflow-y-auto">
        ${rows || `<li class="py-3 text-sm text-slate-500">No deadlines yet — add one below.</li>`}
      </ul>

      <form id="deadline-form" class="flex flex-wrap gap-2">
        <input name="title" placeholder="New deadline…" required
               class="flex-1 min-w-40 bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
        <select name="source" class="bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-2 text-sm">
          <option value="uni">🎓 Uni</option>
          <option value="hustle">💼 Hustle</option>
        </select>
        <input name="dueDate" type="date" value="${todayISO()}" required
               class="bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-2 text-sm text-slate-300" />
        <button class="bg-indigo-500 hover:bg-indigo-400 text-white rounded-lg px-4 py-2 text-sm font-medium">Add</button>
      </form>`;
  },
};

/* =========================================================
   ENERGY RANKER — tasks sorted into high/medium/low brainpower lanes
   ========================================================= */

const LEVELS = [
  { key: "high", label: "High", icon: "🔥", accent: "text-rose-300", ring: "ring-rose-400/60", chip: "bg-rose-500/15 border-rose-500/40" },
  { key: "medium", label: "Medium", icon: "⚡", accent: "text-amber-300", ring: "ring-amber-400/60", chip: "bg-amber-500/15 border-amber-500/40" },
  { key: "low", label: "Low", icon: "🌙", accent: "text-sky-300", ring: "ring-sky-400/60", chip: "bg-sky-500/15 border-sky-500/40" },
];

const EnergyRanker = {
  el: null,

  init() {
    this.el = document.getElementById("energy-module");

    this.el.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const { action, id, level } = btn.dataset;
      if (action === "set-energy") {
        Store.setSetting("currentEnergy", level);
        this.render();
      } else if (action === "toggle-task") {
        const t = Store.state.tasks.find((t) => t.id === id);
        if (t) Store.update("tasks", id, { done: !t.done });
      } else if (action === "delete-task") {
        Store.remove("tasks", id);
      }
    });

    this.el.addEventListener("submit", (e) => {
      if (e.target.id !== "task-form") return;
      e.preventDefault();
      const f = e.target;
      const title = f.title.value.trim();
      if (!title) return;
      Store.add("tasks", {
        id: Store.uid("tk"),
        title,
        energy: f.energy.value,
        done: false,
        linkedDeadlineId: f.deadline.value || null,
        createdAt: new Date().toISOString(),
      });
      f.reset();
    });

    Store.subscribe("tasks:changed", () => this.render());
    Store.subscribe("deadlines:changed", () => this.render()); // linked badges
    this.render();
  },

  render() {
    const current = Store.state.settings.currentEnergy;
    const deadlineTitle = (id) => Store.state.deadlines.find((d) => d.id === id)?.title;

    const energyButtons = LEVELS.map((l) => `
      <button data-action="set-energy" data-level="${l.key}"
              class="px-3 py-1.5 rounded-full text-xs font-medium border transition
                     ${current === l.key ? `${l.chip} ${l.accent}` : "border-slate-700 text-slate-400 hover:border-slate-500"}">
        ${l.icon} ${l.label}
      </button>`).join("");

    const columns = LEVELS.map((l) => {
      const tasks = Store.state.tasks
        .filter((t) => t.energy === l.key)
        .sort((a, b) => a.done - b.done);
      const active = current === l.key;

      const cards = tasks.map((t) => {
        const linked = t.linkedDeadlineId ? deadlineTitle(t.linkedDeadlineId) : null;
        return `
          <li class="flex items-start gap-2 bg-slate-800/60 rounded-lg px-2.5 py-2 group">
            <button data-action="toggle-task" data-id="${t.id}"
                    class="mt-0.5 w-4 h-4 shrink-0 rounded border ${t.done ? "bg-emerald-500 border-emerald-500" : "border-slate-600 hover:border-slate-400"} flex items-center justify-center text-[10px] text-slate-950 font-bold">
              ${t.done ? "✓" : ""}
            </button>
            <div class="flex-1 min-w-0 text-sm">
              <p class="${t.done ? "line-through text-slate-500" : ""}">${escapeHtml(t.title)}</p>
              ${linked ? `<p class="text-[11px] text-slate-500 truncate">🔗 ${escapeHtml(linked)}</p>` : ""}
            </div>
            <button data-action="delete-task" data-id="${t.id}"
                    class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400">✕</button>
          </li>`;
      }).join("");

      return `
        <div class="rounded-xl bg-slate-900/80 border border-slate-800 p-3 ${active ? `ring-2 ${l.ring}` : ""}">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-sm font-semibold ${l.accent}">${l.icon} ${l.label}</h3>
            ${active ? `<span class="text-[10px] uppercase tracking-wide text-slate-400">do these now</span>` : ""}
          </div>
          <ul class="space-y-1.5 min-h-10">
            ${cards || `<li class="text-xs text-slate-600 py-1">Nothing here.</li>`}
          </ul>
        </div>`;
    }).join("");

    const deadlineOptions = Store.state.deadlines
      .filter((d) => !d.done)
      .map((d) => `<option value="${d.id}">${escapeHtml(d.title)}</option>`)
      .join("");

    this.el.innerHTML = `
      <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
        <h2 class="font-semibold text-slate-100">⚡ Energy Ranker</h2>
        <div class="flex items-center gap-1.5">
          <span class="text-xs text-slate-500 mr-1">My energy:</span>
          ${energyButtons}
        </div>
      </div>

      <div class="grid grid-cols-1 gap-3 mb-3">${columns}</div>

      <form id="task-form" class="flex flex-wrap gap-2">
        <input name="title" placeholder="New task…" required
               class="flex-1 min-w-36 bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
        <select name="energy" class="bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-2 text-sm">
          <option value="high">🔥 High</option>
          <option value="medium">⚡ Medium</option>
          <option value="low">🌙 Low</option>
        </select>
        <select name="deadline" class="bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-2 text-sm max-w-36">
          <option value="">No link</option>
          ${deadlineOptions}
        </select>
        <button class="bg-indigo-500 hover:bg-indigo-400 text-white rounded-lg px-4 py-2 text-sm font-medium">Add</button>
      </form>`;
  },
};

/* =========================================================
   LEDGER MODULE — side hustle income/expense tracker + monthly P/L chart
   ========================================================= */

const monthKey = (y, m) => `${y}-${String(m + 1).padStart(2, "0")}`;

const LedgerModule = {
  el: null,
  view: { y: 0, m: 0 },

  init() {
    this.el = document.getElementById("ledger-module");
    const now = new Date();
    this.view = { y: now.getFullYear(), m: now.getMonth() };

    this.el.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const { action, id } = btn.dataset;
      if (action === "prev-month") {
        this.view.m--;
        if (this.view.m < 0) { this.view.m = 11; this.view.y--; }
        this.render();
      } else if (action === "next-month") {
        this.view.m++;
        if (this.view.m > 11) { this.view.m = 0; this.view.y++; }
        this.render();
      } else if (action === "delete-tx") {
        Store.remove("transactions", id);
      } else if (action === "set-currency") {
        Store.setSetting("currency", btn.dataset.currency);
      }
    });

    this.el.addEventListener("submit", (e) => {
      if (e.target.id !== "tx-form") return;
      e.preventDefault();
      const f = e.target;
      const amount = parseFloat(f.amount.value);
      if (!amount || amount <= 0) return;
      Store.add("transactions", {
        id: Store.uid("tx"),
        type: f.type.value,
        amount,
        category: f.category.value.trim() || "General",
        description: f.description.value.trim(),
        date: f.date.value || todayISO(),
      });
      f.reset();
      f.date.value = todayISO();
    });

    Store.subscribe("transactions:changed", () => this.render());
    Store.subscribe("settings:changed", () => this.render());
    this.render();
  },

  totalsFor(key) {
    let income = 0, expense = 0;
    for (const tx of Store.state.transactions) {
      if (!tx.date.startsWith(key)) continue;
      if (tx.type === "income") income += tx.amount;
      else expense += tx.amount;
    }
    return { income, expense, net: income - expense };
  },

  render() {
    const { y, m } = this.view;
    const cur = Store.state.settings.currency;
    const key = monthKey(y, m);
    const monthName = new Date(y, m, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
    const fmt = (n) => `${cur}${n.toFixed(2).replace(/\.00$/, "")}`;

    const { income, expense, net } = this.totalsFor(key);

    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(y, m - i, 1);
      months.push({
        key: monthKey(d.getFullYear(), d.getMonth()),
        label: d.toLocaleDateString(undefined, { month: "short" }),
        ...this.totalsFor(monthKey(d.getFullYear(), d.getMonth())),
      });
    }
    const maxVal = Math.max(1, ...months.flatMap((mo) => [mo.income, mo.expense]));
    const bars = months.map((mo) => {
      const hIn = Math.round((mo.income / maxVal) * 100);
      const hEx = Math.round((mo.expense / maxVal) * 100);
      const isCurrent = mo.key === key;
      return `
        <div class="flex-1 flex flex-col items-center gap-1">
          <div class="w-full h-24 flex items-end justify-center gap-1">
            <div class="w-3 rounded-t bg-emerald-400/80" style="height:${hIn}%" title="Income ${fmt(mo.income)}"></div>
            <div class="w-3 rounded-t bg-rose-400/80" style="height:${hEx}%" title="Expenses ${fmt(mo.expense)}"></div>
          </div>
          <span class="text-[10px] ${isCurrent ? "text-indigo-300 font-semibold" : "text-slate-500"}">${mo.label}</span>
          <span class="text-[10px] ${mo.net >= 0 ? "text-emerald-400" : "text-rose-400"}">${mo.net >= 0 ? "+" : "−"}${fmt(Math.abs(mo.net))}</span>
        </div>`;
    }).join("");

    const txs = Store.state.transactions
      .filter((tx) => tx.date.startsWith(key))
      .sort((a, b) => b.date.localeCompare(a.date));
    const rows = txs.map((tx) => `
      <li class="flex items-center gap-3 py-2 group text-sm">
        <span class="w-7 h-7 shrink-0 rounded-full flex items-center justify-center text-xs
                     ${tx.type === "income" ? "bg-emerald-500/15 text-emerald-300" : "bg-rose-500/15 text-rose-300"}">
          ${tx.type === "income" ? "↑" : "↓"}
        </span>
        <div class="flex-1 min-w-0">
          <p class="truncate">${escapeHtml(tx.description || tx.category)}</p>
          <p class="text-[11px] text-slate-500">${escapeHtml(tx.category)} · ${formatDate(tx.date)}</p>
        </div>
        <span class="font-medium ${tx.type === "income" ? "text-emerald-300" : "text-rose-300"}">
          ${tx.type === "income" ? "+" : "−"}${fmt(tx.amount)}
        </span>
        <button data-action="delete-tx" data-id="${tx.id}"
                class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 px-1">✕</button>
      </li>`).join("");

    const currencyToggle = ["£", "$"].map((c) => `
      <button data-action="set-currency" data-currency="${c}"
              class="w-7 h-7 rounded text-sm font-medium ${cur === c ? "bg-indigo-500/20 text-indigo-300 border border-indigo-400/60" : "text-slate-500 hover:text-slate-300 border border-transparent"}">
        ${c}
      </button>`).join("");

    this.el.innerHTML = `
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold text-slate-100">💰 Hustle Ledger</h2>
        <div class="flex items-center gap-2 text-sm">
          <div class="flex items-center gap-0.5 mr-1">${currencyToggle}</div>
          <button data-action="prev-month" class="px-2 py-1 rounded hover:bg-slate-800">‹</button>
          <span class="w-32 text-center text-slate-300">${monthName}</span>
          <button data-action="next-month" class="px-2 py-1 rounded hover:bg-slate-800">›</button>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 mb-4 text-center">
        <div class="rounded-lg bg-slate-800/60 py-2">
          <p class="text-[11px] text-slate-500">Income</p>
          <p class="text-emerald-300 font-semibold">${fmt(income)}</p>
        </div>
        <div class="rounded-lg bg-slate-800/60 py-2">
          <p class="text-[11px] text-slate-500">Expenses</p>
          <p class="text-rose-300 font-semibold">${fmt(expense)}</p>
        </div>
        <div class="rounded-lg bg-slate-800/60 py-2 ${net >= 0 ? "ring-1 ring-emerald-500/30" : "ring-1 ring-rose-500/30"}">
          <p class="text-[11px] text-slate-500">Net P/L</p>
          <p class="${net >= 0 ? "text-emerald-300" : "text-rose-300"} font-semibold">${net >= 0 ? "+" : "−"}${fmt(Math.abs(net))}</p>
        </div>
      </div>

      <div class="flex gap-1 mb-4 px-1">${bars}</div>

      <ul class="divide-y divide-slate-800 mb-3 max-h-44 overflow-y-auto">
        ${rows || `<li class="py-3 text-sm text-slate-500">No transactions this month.</li>`}
      </ul>

      <form id="tx-form" class="grid grid-cols-2 sm:grid-cols-6 gap-2">
        <select name="type" class="bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-2 text-sm">
          <option value="income">＋ Income</option>
          <option value="expense">− Expense</option>
        </select>
        <input name="amount" type="number" step="0.01" min="0.01" placeholder="0.00" required
               class="bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
        <input name="category" placeholder="Category"
               class="bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
        <input name="description" placeholder="Description"
               class="col-span-2 sm:col-span-1 bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
        <input name="date" type="date" value="${todayISO()}"
               class="bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-2 text-sm text-slate-300" />
        <button class="bg-indigo-500 hover:bg-indigo-400 text-white rounded-lg px-4 py-2 text-sm font-medium">Log</button>
      </form>`;
  },
};

/* =========================================================
   BRAIN DUMP — rapid capture, tag filter, promote note → task
   ========================================================= */

const BrainDump = {
  el: null,
  filter: "all",
  selectedTag: null,

  init() {
    this.el = document.getElementById("notes-module");

    this.el.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const { action, id, tag } = btn.dataset;
      if (action === "set-filter") {
        this.filter = tag;
        this.render();
      } else if (action === "pick-tag") {
        this.selectedTag = this.selectedTag === tag ? null : tag;
        const input = this.el.querySelector("#note-input");
        const text = input?.value ?? "";
        this.render();
        const restored = this.el.querySelector("#note-input");
        restored.value = text;
        restored.focus();
      } else if (action === "promote-note") {
        const note = Store.state.notes.find((n) => n.id === id);
        if (!note || note.promoted) return;
        Store.add("tasks", {
          id: Store.uid("tk"),
          title: note.text,
          energy: "medium",
          done: false,
          linkedDeadlineId: null,
          createdAt: new Date().toISOString(),
        });
        Store.update("notes", id, { promoted: true });
      } else if (action === "delete-note") {
        Store.remove("notes", id);
      }
    });

    this.el.addEventListener("keydown", (e) => {
      if (e.target.id === "note-input" && e.key === "Enter") {
        e.preventDefault();
        this.saveNote();
      }
    });
    this.el.addEventListener("click", (e) => {
      if (e.target.closest("#note-save")) this.saveNote();
    });

    Store.subscribe("notes:changed", () => this.render());
    this.render();
  },

  saveNote() {
    const input = this.el.querySelector("#note-input");
    const text = input.value.trim();
    if (!text) return;
    Store.add("notes", {
      id: Store.uid("nt"),
      text,
      tag: this.selectedTag,
      createdAt: new Date().toISOString(),
      promoted: false,
    });
    this.selectedTag = null;
    this.el.querySelector("#note-input").focus();
  },

  relTime(iso) {
    const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  },

  render() {
    const filters = [
      { key: "all", label: "All" },
      { key: "uni", label: "🎓 Uni" },
      { key: "hustle", label: "💼 Hustle" },
    ];
    const filterChips = filters.map((f) => `
      <button data-action="set-filter" data-tag="${f.key}"
              class="px-3 py-1 rounded-full text-xs border transition
                     ${this.filter === f.key ? "bg-indigo-500/20 border-indigo-400/60 text-indigo-200" : "border-slate-700 text-slate-400 hover:border-slate-500"}">
        ${f.label}
      </button>`).join("");

    const tagChips = ["uni", "hustle"].map((t) => `
      <button data-action="pick-tag" data-tag="${t}" type="button"
              class="px-2.5 py-1.5 rounded-lg text-xs border transition
                     ${this.selectedTag === t ? SOURCE[t].badge : "border-slate-700 text-slate-500 hover:border-slate-500"}">
        ${t === "uni" ? "🎓" : "💼"} ${SOURCE[t].label}
      </button>`).join("");

    const notes = [...Store.state.notes]
      .filter((n) => this.filter === "all" || n.tag === this.filter)
      .sort((a, b) => b.createdAt.localeCompare(a.createdAt));

    const feed = notes.map((n) => {
      const s = n.tag ? SOURCE[n.tag] : null;
      return `
        <li class="bg-slate-800/50 rounded-xl px-3 py-2.5 group">
          <p class="text-sm whitespace-pre-wrap break-words">${escapeHtml(n.text)}</p>
          <div class="flex items-center gap-2 mt-1.5">
            ${s ? `<span class="text-[10px] px-2 py-0.5 rounded-full ${s.badge}">${s.label}</span>` : ""}
            <span class="text-[11px] text-slate-500">${this.relTime(n.createdAt)}</span>
            <span class="flex-1"></span>
            ${n.promoted
              ? `<span class="text-[11px] text-emerald-400">✓ tasked</span>`
              : `<button data-action="promote-note" data-id="${n.id}"
                         class="opacity-0 group-hover:opacity-100 text-[11px] text-indigo-300 hover:text-indigo-200 border border-indigo-500/40 rounded px-2 py-0.5">→ Task</button>`}
            <button data-action="delete-note" data-id="${n.id}"
                    class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 text-sm px-1">✕</button>
          </div>
        </li>`;
    }).join("");

    this.el.innerHTML = `
      <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
        <h2 class="font-semibold text-slate-100">📝 Brain Dump</h2>
        <div class="flex gap-1.5">${filterChips}</div>
      </div>

      <div class="flex gap-2 mb-3">
        <input id="note-input" placeholder="Dump an idea, hit Enter…"
               class="flex-1 bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
        ${tagChips}
        <button id="note-save" class="bg-indigo-500 hover:bg-indigo-400 text-white rounded-lg px-4 py-2 text-sm font-medium">Save</button>
      </div>

      <ul class="space-y-2 max-h-80 overflow-y-auto pr-1">
        ${feed || `<li class="text-sm text-slate-500 py-2">Empty head? Lucky you.</li>`}
      </ul>`;
  },
};

/* =========================================================
   GYM MODULE — full workout logger (exercises/sets/reps/weight) + per-lift progress chart
   ========================================================= */

const GymModule = {
  el: null,
  draft: null,
  selectedExercise: null,

  init() {
    this.el = document.getElementById("gym-module");
    this.resetDraft();

    this.el.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const { action, idx, sidx, id, name } = btn.dataset;
      if (action === "draft-add-exercise") {
        this.draft.exercises.push({ name: "", sets: [{ reps: "", weight: "" }] });
        this.render();
      } else if (action === "draft-remove-exercise") {
        this.draft.exercises.splice(Number(idx), 1);
        this.render();
      } else if (action === "draft-add-set") {
        this.draft.exercises[Number(idx)].sets.push({ reps: "", weight: "" });
        this.render();
      } else if (action === "draft-remove-set") {
        this.draft.exercises[Number(idx)].sets.splice(Number(sidx), 1);
        this.render();
      } else if (action === "save-workout") {
        this.saveWorkout();
      } else if (action === "delete-workout") {
        Store.remove("workouts", id);
      } else if (action === "select-progress-exercise") {
        this.selectedExercise = name;
        this.render();
      }
    });

    this.el.addEventListener("input", (e) => {
      const t = e.target;
      if (t.dataset.field === "draft-date") {
        this.draft.date = t.value;
      } else if (t.dataset.field === "draft-label") {
        this.draft.label = t.value;
      } else if (t.dataset.field === "ex-name") {
        this.draft.exercises[Number(t.dataset.exidx)].name = t.value;
      } else if (t.dataset.field === "set-reps") {
        this.draft.exercises[Number(t.dataset.exidx)].sets[Number(t.dataset.setidx)].reps = t.value;
      } else if (t.dataset.field === "set-weight") {
        this.draft.exercises[Number(t.dataset.exidx)].sets[Number(t.dataset.setidx)].weight = t.value;
      }
    });

    Store.subscribe("workouts:changed", () => this.render());
    this.render();
  },

  resetDraft() {
    this.draft = {
      date: todayISO(),
      label: "",
      exercises: [{ name: "", sets: [{ reps: "", weight: "" }] }],
    };
  },

  saveWorkout() {
    const exercises = this.draft.exercises
      .map((ex) => ({
        name: ex.name.trim(),
        sets: ex.sets
          .map((s) => ({ reps: parseFloat(s.reps), weight: parseFloat(s.weight) }))
          .filter((s) => s.reps > 0 && s.weight >= 0 && !isNaN(s.reps) && !isNaN(s.weight)),
      }))
      .filter((ex) => ex.name && ex.sets.length > 0);

    if (exercises.length === 0) return;

    Store.add("workouts", {
      id: Store.uid("wo"),
      date: this.draft.date || todayISO(),
      label: this.draft.label.trim(),
      exercises,
    });
    this.resetDraft();
  },

  allExerciseNames() {
    const names = new Set();
    Store.state.workouts.forEach((w) => w.exercises.forEach((ex) => names.add(ex.name)));
    return [...names].sort((a, b) => a.localeCompare(b));
  },

  render() {
    const draftHtml = this.draft.exercises.map((ex, exi) => `
      <div class="bg-slate-800/60 rounded-lg p-2.5 space-y-2">
        <div class="flex items-center gap-2">
          <input data-field="ex-name" data-exidx="${exi}" value="${escapeHtml(ex.name)}" placeholder="Exercise name…"
                 class="flex-1 bg-slate-900/60 border border-slate-700 rounded px-2 py-1.5 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
          <button data-action="draft-remove-exercise" data-idx="${exi}" class="text-slate-500 hover:text-rose-400 text-sm px-1">✕</button>
        </div>
        <div class="space-y-1.5">
          ${ex.sets.map((s, si) => `
            <div class="flex items-center gap-2 pl-2">
              <span class="text-[11px] text-slate-500 w-10">Set ${si + 1}</span>
              <input data-field="set-reps" data-exidx="${exi}" data-setidx="${si}" type="number" min="0" value="${s.reps}" placeholder="reps"
                     class="w-16 bg-slate-900/60 border border-slate-700 rounded px-2 py-1 text-xs placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
              <span class="text-slate-600 text-xs">×</span>
              <input data-field="set-weight" data-exidx="${exi}" data-setidx="${si}" type="number" min="0" step="0.5" value="${s.weight}" placeholder="kg"
                     class="w-16 bg-slate-900/60 border border-slate-700 rounded px-2 py-1 text-xs placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
              <button data-action="draft-remove-set" data-idx="${exi}" data-sidx="${si}" class="text-slate-600 hover:text-rose-400 text-xs px-1">✕</button>
            </div>`).join("")}
          <button data-action="draft-add-set" data-idx="${exi}" class="text-[11px] text-indigo-300 hover:text-indigo-200 pl-2">+ Add set</button>
        </div>
      </div>`).join("");

    const sortedWorkouts = [...Store.state.workouts].sort((a, b) => b.date.localeCompare(a.date));
    const historyHtml = sortedWorkouts.map((w) => `
      <li class="bg-slate-800/50 rounded-xl px-3 py-2.5 group">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-sm font-medium">${escapeHtml(w.label || "Workout")}</span>
          <span class="text-[11px] text-slate-500">${formatDate(w.date)}</span>
          <span class="flex-1"></span>
          <button data-action="delete-workout" data-id="${w.id}"
                  class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 text-sm px-1">✕</button>
        </div>
        <ul class="text-xs text-slate-400 space-y-0.5">
          ${w.exercises.map((ex) => `
            <li>${escapeHtml(ex.name)}: ${ex.sets.map((s) => `${s.reps}×${s.weight}kg`).join(", ")}</li>
          `).join("")}
        </ul>
      </li>`).join("");

    const exerciseNames = this.allExerciseNames();
    if (!this.selectedExercise || !exerciseNames.includes(this.selectedExercise)) {
      this.selectedExercise = exerciseNames[exerciseNames.length - 1] ?? null;
    }

    let progressHtml = `<p class="text-sm text-slate-500">Log a workout to see progress here.</p>`;
    if (this.selectedExercise) {
      const sessions = sortedWorkouts
        .slice()
        .reverse()
        .map((w) => {
          const ex = w.exercises.find((e) => e.name === this.selectedExercise);
          if (!ex) return null;
          const maxWeight = Math.max(...ex.sets.map((s) => s.weight));
          return { date: w.date, maxWeight };
        })
        .filter(Boolean);

      const maxVal = Math.max(1, ...sessions.map((s) => s.maxWeight));
      const bars = sessions.map((s) => {
        const h = Math.round((s.maxWeight / maxVal) * 100);
        return `
          <div class="flex-1 flex flex-col items-center gap-1 min-w-8">
            <div class="w-full h-24 flex items-end justify-center">
              <div class="w-4 rounded-t bg-indigo-400/80" style="height:${h}%" title="${s.maxWeight}kg on ${formatDate(s.date)}"></div>
            </div>
            <span class="text-[10px] text-slate-500">${formatDate(s.date)}</span>
            <span class="text-[10px] text-indigo-300">${s.maxWeight}kg</span>
          </div>`;
      }).join("");

      const exerciseTabs = exerciseNames.map((name) => `
        <button data-action="select-progress-exercise" data-name="${escapeHtml(name)}"
                class="px-2.5 py-1 rounded-full text-xs border transition
                       ${name === this.selectedExercise ? "bg-indigo-500/20 border-indigo-400/60 text-indigo-200" : "border-slate-700 text-slate-400 hover:border-slate-500"}">
          ${escapeHtml(name)}
        </button>`).join("");

      progressHtml = `
        <div class="flex flex-wrap gap-1.5 mb-3">${exerciseTabs}</div>
        <div class="flex gap-1 overflow-x-auto pb-1">${bars || `<p class="text-sm text-slate-500">No sessions logged for this exercise yet.</p>`}</div>`;
    }

    this.el.innerHTML = `
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold text-slate-100">🏋️ Gym Log</h2>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div>
          <h3 class="text-sm font-semibold text-slate-300 mb-2">Log a workout</h3>
          <div class="flex gap-2 mb-2">
            <input data-field="draft-date" type="date" value="${this.draft.date}"
                   class="bg-slate-800/80 border border-slate-700 rounded-lg px-2 py-2 text-sm text-slate-300" />
            <input data-field="draft-label" value="${escapeHtml(this.draft.label)}" placeholder="Session label (e.g. Push Day)"
                   class="flex-1 bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
          </div>
          <div class="space-y-2 mb-2">${draftHtml}</div>
          <div class="flex items-center gap-2">
            <button data-action="draft-add-exercise" class="text-xs text-indigo-300 hover:text-indigo-200 border border-indigo-500/40 rounded-lg px-3 py-1.5">+ Add exercise</button>
            <span class="flex-1"></span>
            <button data-action="save-workout" class="bg-indigo-500 hover:bg-indigo-400 text-white rounded-lg px-4 py-2 text-sm font-medium">Save Workout</button>
          </div>

          <h3 class="text-sm font-semibold text-slate-300 mt-4 mb-2">History</h3>
          <ul class="space-y-2 max-h-56 overflow-y-auto pr-1">
            ${historyHtml || `<li class="text-sm text-slate-500 py-2">No workouts logged yet.</li>`}
          </ul>
        </div>

        <div>
          <h3 class="text-sm font-semibold text-slate-300 mb-2">Progress</h3>
          ${progressHtml}
        </div>
      </div>`;
  },
};

/* =========================================================
   PORTFOLIO MODULE — holdings monitor with buy-merging, live prices (Finnhub),
   live USD→GBP conversion (ECB via frankfurter), animated allocation pie
   ========================================================= */

const FINNHUB_KEY = "d98ii7hr01qkl0vtf940d98ii7hr01qkl0vtf94g";
const NEON = ["#22d3ee", "#a78bfa", "#f472b6", "#34d399", "#fb923c", "#818cf8", "#facc15", "#2dd4bf", "#f87171", "#c084fc"];

async function fetchQuote(ticker) {
  const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(ticker)}&token=${FINNHUB_KEY}`);
  if (!res.ok) throw new Error("Quote request failed");
  const data = await res.json();
  if (!data.c || data.c === 0) throw new Error("Unknown ticker or no data");
  return data.c;
}

async function fetchFxRate() {
  const res = await fetch("https://api.frankfurter.dev/v1/latest?base=USD&symbols=GBP");
  if (!res.ok) throw new Error("FX request failed");
  return (await res.json()).rates.GBP;
}

// donut segment path between two angles (radians)
function arcPath(cx, cy, rO, rI, a0, a1) {
  const large = a1 - a0 > Math.PI ? 1 : 0;
  const p = (r, a) => `${(cx + r * Math.cos(a)).toFixed(2)} ${(cy + r * Math.sin(a)).toFixed(2)}`;
  return `M ${p(rO, a0)} A ${rO} ${rO} 0 ${large} 1 ${p(rO, a1)} L ${p(rI, a1)} A ${rI} ${rI} 0 ${large} 0 ${p(rI, a0)} Z`;
}

const PIE_CSS = `
#portfolio-module { position: relative; }
#pie-tooltip { position: absolute; pointer-events: none; background: rgba(2,6,23,.94); border: 1px solid rgba(129,140,248,.45); border-radius: 8px; padding: 6px 10px; font-size: 12px; line-height: 1.5; color: #e2e8f0; opacity: 0; transition: opacity .15s; z-index: 30; white-space: nowrap; }
.pie-anim { animation: pieIn .9s cubic-bezier(.22,1,.36,1) backwards; }
@keyframes pieIn { from { opacity: 0; transform: scale(.82) rotate(-12deg); } }
.pie-glow { animation: pieBreathe 5s ease-in-out infinite alternate; }
@keyframes pieBreathe { from { filter: drop-shadow(0 0 6px rgba(129,140,248,.22)); } to { filter: drop-shadow(0 0 14px rgba(129,140,248,.45)); } }
.pie-seg { fill-opacity: .55; stroke: #020617; stroke-width: 2; cursor: pointer; transition: transform .25s ease, fill-opacity .25s ease, filter .25s ease; animation: segIn .7s ease backwards; }
@keyframes segIn { from { fill-opacity: 0; } }
.pie-seg:hover { transform: translate(var(--tx), var(--ty)); fill-opacity: .9; filter: drop-shadow(0 0 12px var(--glow)); }
`;

const PortfolioModule = {
  el: null,
  refreshing: false,
  showBuyForm: false,
  fxRate: null,

  init() {
    this.el = document.getElementById("portfolio-module");

    if (!document.getElementById("portfolio-css")) {
      const style = document.createElement("style");
      style.id = "portfolio-css";
      style.textContent = PIE_CSS;
      document.head.appendChild(style);
    }

    this.el.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const { action, id } = btn.dataset;
      if (action === "delete-holding") {
        Store.remove("holdings", id);
      } else if (action === "refresh-prices") {
        this.refreshAll();
      } else if (action === "toggle-buy-form") {
        this.showBuyForm = !this.showBuyForm;
        this.render();
        this.el.querySelector("#buy-form input[name=ticker]")?.focus();
      } else if (action === "set-portfolio-currency") {
        Store.setSetting("portfolioCurrency", btn.dataset.currency);
      }
    });

    this.el.addEventListener("submit", async (e) => {
      if (e.target.id !== "buy-form") return;
      e.preventDefault();
      const f = e.target;
      const ticker = f.ticker.value.trim().toUpperCase();
      const shares = parseFloat(f.shares.value);
      const price = parseFloat(f.price.value);
      if (!ticker || !(shares > 0) || !(price > 0)) return;

      const errEl = this.el.querySelector("#buy-form-error");
      errEl.classList.add("hidden");
      const submitBtn = f.querySelector("button[type=submit]");
      submitBtn.disabled = true;
      submitBtn.textContent = "Adding…";

      try {
        const existing = Store.state.holdings.find((h) => h.ticker === ticker);
        this.showBuyForm = false;
        if (existing) {
          // merge the buy: add shares, recompute weighted-average cost
          const totalShares = existing.shares + shares;
          const avgPrice = (existing.shares * existing.buyPrice + shares * price) / totalShares;
          Store.update("holdings", existing.id, { shares: +totalShares.toFixed(6), buyPrice: +avgPrice.toFixed(4) });
        } else {
          const currentPrice = await fetchQuote(ticker);
          Store.add("holdings", {
            id: Store.uid("hd"),
            ticker,
            shares,
            buyPrice: price,
            currentPrice,
            lastUpdated: new Date().toISOString(),
          });
        }
      } catch (err) {
        this.showBuyForm = true;
        this.render();
        const restoredErr = this.el.querySelector("#buy-form-error");
        restoredErr.textContent = `Couldn't fetch a price for "${ticker}" — check the ticker symbol.`;
        restoredErr.classList.remove("hidden");
      }
    });

    // pie hover tooltip (delegated, survives re-renders)
    this.el.addEventListener("mousemove", (e) => {
      const tip = this.el.querySelector("#pie-tooltip");
      if (!tip) return;
      const seg = e.target.closest?.(".pie-seg");
      if (!seg) { tip.style.opacity = "0"; return; }
      const rect = this.el.getBoundingClientRect();
      tip.style.left = `${e.clientX - rect.left + 14}px`;
      tip.style.top = `${e.clientY - rect.top - 12}px`;
      tip.style.opacity = "1";
      tip.innerHTML = `<b>${seg.dataset.ticker}</b> · ${seg.dataset.value}<br>${seg.dataset.pct}% of total`;
    });
    this.el.addEventListener("mouseleave", () => {
      const tip = this.el.querySelector("#pie-tooltip");
      if (tip) tip.style.opacity = "0";
    });

    Store.subscribe("holdings:changed", () => this.render());
    Store.subscribe("settings:changed", () => this.render());
    this.render();

    fetchFxRate().then((r) => { this.fxRate = r; this.render(); }).catch(() => {});
  },

  cur() {
    return Store.state.settings.portfolioCurrency ?? "£";
  },

  money(usd) {
    if (this.cur() === "£" && this.fxRate) return `£${(usd * this.fxRate).toFixed(2)}`;
    return `$${usd.toFixed(2)}`;
  },

  async refreshAll() {
    if (this.refreshing) return;
    this.refreshing = true;
    this.render();

    const holdings = Store.state.holdings;
    const [quotes, fx] = await Promise.all([
      Promise.allSettled(holdings.map((h) => fetchQuote(h.ticker))),
      fetchFxRate().catch(() => null),
    ]);
    if (fx) this.fxRate = fx;
    quotes.forEach((r, i) => {
      if (r.status === "fulfilled") {
        Store.update("holdings", holdings[i].id, { currentPrice: r.value, lastUpdated: new Date().toISOString() });
      }
    });

    this.refreshing = false;
    this.render();
  },

  renderPie(holdings, totalValue) {
    if (!holdings.length || totalValue <= 0) {
      return `<div class="text-sm text-slate-500 py-10 text-center">Log a buy to see your allocation.</div>`;
    }
    const cx = 110, cy = 110, rO = 100, rI = 62;
    let a = -Math.PI / 2;
    const segs = holdings.map((h, i) => {
      const val = h.shares * h.currentPrice;
      const frac = val / totalValue;
      const span = Math.min(frac * 2 * Math.PI, 2 * Math.PI - 0.0001);
      const a0 = a, a1 = a + span;
      a = a1;
      const mid = (a0 + a1) / 2;
      const color = NEON[i % NEON.length];
      return `<path class="pie-seg" d="${arcPath(cx, cy, rO, rI, a0, a1)}" fill="${color}"
        style="--tx:${(Math.cos(mid) * 7).toFixed(1)}px; --ty:${(Math.sin(mid) * 7).toFixed(1)}px; --glow:${color}; animation-delay:${i * 110}ms"
        data-ticker="${escapeHtml(h.ticker)}" data-pct="${(frac * 100).toFixed(1)}" data-value="${this.money(val)}"></path>`;
    }).join("");

    const legend = holdings.map((h, i) => `
      <span class="flex items-center gap-1.5 text-xs text-slate-400">
        <span class="w-2.5 h-2.5 rounded-full" style="background:${NEON[i % NEON.length]}; box-shadow:0 0 6px ${NEON[i % NEON.length]}"></span>${escapeHtml(h.ticker)}
      </span>`).join("");

    return `
      <div class="flex flex-col items-center gap-3">
        <svg viewBox="0 0 220 220" class="w-60 h-60 pie-anim">
          <g class="pie-glow">${segs}</g>
          <text x="110" y="103" text-anchor="middle" fill="#64748b" font-size="11">Total</text>
          <text x="110" y="123" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">${this.money(totalValue)}</text>
        </svg>
        <div class="flex flex-wrap justify-center gap-3">${legend}</div>
      </div>`;
  },

  render() {
    const holdings = [...Store.state.holdings].sort(
      (a, b) => b.shares * b.currentPrice - a.shares * a.currentPrice
    );

    let totalCost = 0, totalValue = 0;
    const rows = holdings.map((h, i) => {
      const cost = h.shares * h.buyPrice;
      const value = h.shares * h.currentPrice;
      const gain = value - cost;
      const gainPct = cost > 0 ? (gain / cost) * 100 : 0;
      totalCost += cost;
      totalValue += value;
      const up = gain >= 0;
      return `
        <li class="flex items-center gap-3 py-2.5 group">
          <span class="w-2 h-2 shrink-0 rounded-full" style="background:${NEON[i % NEON.length]}; box-shadow:0 0 5px ${NEON[i % NEON.length]}"></span>
          <div class="w-16 shrink-0">
            <p class="font-semibold text-sm">${escapeHtml(h.ticker)}</p>
            <p class="text-[11px] text-slate-500">${h.shares}sh</p>
          </div>
          <div class="flex-1 min-w-0 text-xs text-slate-400">
            <p>Avg ${this.money(h.buyPrice)} → Now ${this.money(h.currentPrice)}</p>
          </div>
          <div class="text-right">
            <p class="text-sm font-medium">${this.money(value)}</p>
            <p class="text-xs ${up ? "text-emerald-400" : "text-rose-400"}">${up ? "+" : "−"}${this.money(Math.abs(gain))} (${up ? "+" : "−"}${Math.abs(gainPct).toFixed(1)}%)</p>
          </div>
          <button data-action="delete-holding" data-id="${h.id}"
                  class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 px-1">✕</button>
        </li>`;
    }).join("");

    const totalGain = totalValue - totalCost;
    const totalGainPct = totalCost > 0 ? (totalGain / totalCost) * 100 : 0;
    const up = totalGain >= 0;
    const cur = this.cur();

    const currencyToggle = ["£", "$"].map((c) => `
      <button data-action="set-portfolio-currency" data-currency="${c}"
              class="w-7 h-7 rounded text-sm font-medium ${cur === c ? "bg-indigo-500/20 text-indigo-300 border border-indigo-400/60" : "text-slate-500 hover:text-slate-300 border border-transparent"}">
        ${c}
      </button>`).join("");

    const fxNote = cur === "£"
      ? (this.fxRate
          ? `1 USD = £${this.fxRate.toFixed(4)} · live ECB rate. Enter buy prices in the stock's native currency (USD for US stocks).`
          : `Fetching live £ rate — showing $ until it loads.`)
      : `Values in USD (each ticker's native currency).`;

    const buyForm = this.showBuyForm ? `
      <p id="buy-form-error" class="hidden text-xs text-rose-400 mb-2"></p>
      <form id="buy-form" class="flex flex-wrap gap-2 mb-4 bg-slate-800/40 border border-indigo-500/20 rounded-xl p-3">
        <input name="ticker" placeholder="Ticker (e.g. AAPL)" required
               class="w-36 bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-400 uppercase" />
        <input name="shares" type="number" step="any" min="0.000001" placeholder="Shares" required
               class="w-24 bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
        <input name="price" type="number" step="0.01" min="0.01" placeholder="Price paid ($)" required
               class="w-32 bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-400" />
        <button type="submit" class="bg-indigo-500 hover:bg-indigo-400 disabled:opacity-50 text-white rounded-lg px-4 py-2 text-sm font-medium">Add Buy</button>
        <p class="w-full text-[11px] text-slate-500">New ticker creates a holding · existing ticker adds the shares and updates your average cost automatically.</p>
      </form>` : "";

    this.el.innerHTML = `
      <div class="flex items-center justify-between flex-wrap gap-2 mb-2">
        <h2 class="font-semibold text-slate-100">📈 Stock Portfolio</h2>
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-0.5 mr-1">${currencyToggle}</div>
          <button data-action="toggle-buy-form"
                  class="text-xs ${this.showBuyForm ? "text-slate-400 border-slate-600" : "text-indigo-300 hover:text-indigo-200 border-indigo-500/40"} border rounded-lg px-3 py-1.5">
            ${this.showBuyForm ? "✕ Close" : "＋ Log Buy"}
          </button>
          <button data-action="refresh-prices" ${this.refreshing ? "disabled" : ""}
                  class="text-xs text-indigo-300 hover:text-indigo-200 border border-indigo-500/40 rounded-lg px-3 py-1.5 disabled:opacity-50">
            ${this.refreshing ? "Refreshing…" : "↻ Refresh"}
          </button>
        </div>
      </div>

      <p class="text-[11px] text-slate-500 mb-3">${fxNote}</p>

      ${buyForm}

      <div class="grid grid-cols-3 gap-2 mb-4 text-center">
        <div class="rounded-lg bg-slate-800/60 py-2">
          <p class="text-[11px] text-slate-500">Invested</p>
          <p class="font-semibold">${this.money(totalCost)}</p>
        </div>
        <div class="rounded-lg bg-slate-800/60 py-2">
          <p class="text-[11px] text-slate-500">Current Value</p>
          <p class="font-semibold">${this.money(totalValue)}</p>
        </div>
        <div class="rounded-lg bg-slate-800/60 py-2 ${up ? "ring-1 ring-emerald-500/30" : "ring-1 ring-rose-500/30"}">
          <p class="text-[11px] text-slate-500">Total Gain/Loss</p>
          <p class="${up ? "text-emerald-300" : "text-rose-300"} font-semibold">${up ? "+" : "−"}${this.money(Math.abs(totalGain))} (${up ? "+" : "−"}${Math.abs(totalGainPct).toFixed(1)}%)</p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
        <ul class="divide-y divide-slate-800 max-h-72 overflow-y-auto">
          ${rows || `<li class="py-3 text-sm text-slate-500">No holdings yet — hit ＋ Log Buy to add your first.</li>`}
        </ul>
        <div>${this.renderPie(holdings, totalValue)}</div>
      </div>

      <div id="pie-tooltip"></div>`;
  },
};

/* =========================================================
   AUTH GATE — email/password sign-in, then bootstrap + cloud sync
   ========================================================= */

const AuthGate = {
  started: false,

  init() {
    const shell = document.getElementById("app-shell");
    const overlay = document.getElementById("auth-overlay");
    const authForm = document.getElementById("auth-form");
    const errorEl = document.getElementById("auth-error");
    const statusEl = document.getElementById("auth-status");
    const signOutBtn = document.getElementById("sign-out");

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.add("hidden");
      const mode = e.submitter?.dataset.mode || "login";
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value;
      statusEl.textContent = mode === "signup" ? "Creating account…" : "Signing in…";
      try {
        if (mode === "signup") {
          await auth.createUserWithEmailAndPassword(email, password);
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        statusEl.textContent = "";
        errorEl.textContent = err.message;
        errorEl.classList.remove("hidden");
      }
    });

    signOutBtn.addEventListener("click", () => auth.signOut());

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        this.started = false;
        Store._uid = null;
        overlay.classList.remove("hidden");
        shell.classList.add("hidden");
        return;
      }
      overlay.classList.add("hidden");
      shell.classList.remove("hidden");
      if (this.started) return; // avoid double-init on token refresh
      this.started = true;
      await this.bootstrap(user.uid);
    });
  },

  async bootstrap(uid) {
    Store._uid = uid;
    const docRef = db.collection("users").doc(uid);

    try {
      const snap = await docRef.get();
      if (snap.exists) {
        Store.applyRemote(snap.data());
      } else {
        Store.load();
        if (Store.isFirstRun) seedDemoData();
        else Store.pushToCloud();
      }
    } catch (e) {
      console.warn("Could not reach cloud, using local data", e);
      Store.load();
      if (Store.isFirstRun) seedDemoData();
    }

    // real-time sync: pick up changes made from any other signed-in device
    docRef.onSnapshot((snap) => {
      if (snap.exists) Store.applyRemote(snap.data());
    });

    document.getElementById("header-date").textContent =
      new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    [CalendarModule, EnergyRanker, LedgerModule, BrainDump, GymModule, PortfolioModule].forEach((m) => m.init());

    document.getElementById("quick-add").addEventListener("click", () => {
      document.getElementById("notes-module").scrollIntoView({ behavior: "smooth", block: "center" });
      setTimeout(() => document.getElementById("note-input")?.focus(), 350);
    });

    document.querySelectorAll("[data-nav]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.getElementById(btn.dataset.nav)?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
  },
};

AuthGate.init();

})();
